command:
  - "python"
  - "app.py"

env:
  - name: LAKEBASE_SECRET_SCOPE
    value: "database"
  - name: LAKEBASE_SECRET_KEY
    value: "lakebase-url"
  - name: MASSIVE_API_BASE_URL
    value: "https://api.massive.com"
  - name: MASSIVE_SECRET_SCOPE
    value: "massive"
  - name: MASSIVE_SECRET_KEY
    value: "api-key"
  - name: WEATHER_TABLE_NAME
    value: "weather_documents"
  - name: WEATHER_EMBEDDINGS_TABLE_NAME
    value: "weather_embeddings"
  - name: WEATHER_LOCATIONS
    value: "Chicago, IL;Austin, TX"
