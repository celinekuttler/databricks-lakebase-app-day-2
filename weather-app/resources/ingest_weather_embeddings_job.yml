# Databricks Workflow that runs notebooks/ingest_weather_embeddings.py on a
# schedule. The script reads unembedded rows from `weather_documents`, chunks
# and embeds them (all-MiniLM-L6-v2, 384-dim), and upserts the vectors into
# `weather_embeddings` (pgvector) using psycopg2 via lakebase.get_connection().
#
# Deploy: databricks bundle deploy -t dev
# Run once manually: databricks bundle run ingest_weather_embeddings_job -t dev

resources:
  jobs:
    ingest_weather_embeddings_job:
      name: "[${bundle.target}] Ingest Weather Embeddings"

      # Runs daily at 7:00 AM UTC. Flip to UNPAUSED once you've validated a
      # manual run.
      schedule:
        quartz_cron_expression: "0 0 7 * * ?"
        timezone_id: "UTC"
        pause_status: PAUSED  # flip to UNPAUSED once you've validated a manual run

      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}

      max_concurrent_runs: 1

      job_clusters:
        - job_cluster_key: default_cluster
          new_cluster:
            spark_version: "15.4.x-scala2.12"
            node_type_id: "i3.xlarge"
            num_workers: 0
            data_security_mode: SINGLE_USER

      tasks:
        - task_key: ingest_weather_embeddings
          job_cluster_key: default_cluster
          libraries:
            - pypi:
                package: "databricks-sdk>=0.30.0"
            - pypi:
                package: "psycopg2-binary>=2.9.9"
            - pypi:
                package: "sentence-transformers>=3.0.0"
          notebook_task:
            notebook_path: ../notebooks/ingest_weather_embeddings.py
            base_parameters:
              weather_table_name: "weather_documents"
              weather_embeddings_table_name: "weather_embeddings"
              embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
              chunk_size: "800"
              chunk_overlap: "100"
              batch_size: "64"
